[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcrispr"
version = "0.1.0"
description = "Guide-RNA selection as a QUBO, solved classically and with QAOA"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
qcrispr = "qcrispr.cli:main"

[tool.setuptools]
packages = ["qcrispr"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
